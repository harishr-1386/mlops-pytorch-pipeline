apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  replicas: 2

  selector:
    matchLabels:
      app: model-serving

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          # Liveness: restart container if /health stops responding
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          # Readiness: hold traffic until model is loaded
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
              readOnly: true
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

      volumes:
        - name: config-volume
          configMap:
            name: training-config

        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
            readOnly: true
